// Applied by every module: Java toolchain, compiler flags and the JUnit 5 test setup.
plugins {
    id 'java'
}

def libs = versionCatalogs.named('libs')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.findVersion('java').get().requiredVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // -parameters keeps parameter names for Spring binding; -Xlint surfaces suspicious code early
    options.compilerArgs.addAll(['-parameters', '-Xlint:all,-processing,-serial'])
}

dependencies {
    testImplementation platform(libs.findLibrary('junit-bom').get())
    testImplementation libs.findLibrary('junit-jupiter').get()
    testImplementation libs.findLibrary('assertj-core').get()
    testRuntimeOnly libs.findLibrary('junit-platform-launcher').get()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    // One summary line per module, so a green run also shows what was executed
    def moduleName = project.name
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            System.out.println("${moduleName}: ${result.testCount} tests, ${result.successfulTestCount} passed, " +
                    "${result.failedTestCount} failed, ${result.skippedTestCount} skipped -> ${result.resultType}")
        }
    }
}
