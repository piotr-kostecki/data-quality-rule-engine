plugins {
    id 'onboarding.java-conventions'
    id 'onboarding.lombok-conventions'
    alias(libs.plugins.spring.boot)
}

description = 'Spring Boot server: REST, persistence and event adapters around the onboarding hexagon'

dependencies {
    // Gradle-native BOM import instead of the io.spring.dependency-management plugin
    implementation platform(libs.spring.boot.bom)

    implementation project(':onboarding-application')
    implementation libs.bundles.spring.web.server
    // Tracing (W3C trace context, trace ids in logs) and metrics, exported over OTLP with the otel profile
    implementation libs.bundles.observability
    // Logging: code uses the SLF4J API only; Log4j2 is the backend, configured in log4j2-spring.xml
    implementation libs.spring.boot.starter.log4j2
    runtimeOnly libs.log4j.layout.template.json

    testImplementation libs.spring.boot.starter.test
    testImplementation libs.archunit.junit5
    testImplementation testFixtures(project(':partner-quality'))
}

springBoot {
    // META-INF/build-info.properties for /actuator/info; without the build time, so jars stay reproducible
    buildInfo {
        excludes = ['time']
    }
}

configurations.configureEach {
    // Spring Boot starters bring Logback by default; only one SLF4J backend may be on the classpath
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

tasks.withType(Test).configureEach {
    // The Nix dev shell exports SPRING_PROFILES_ACTIVE=dev for bootRun; tests must not inherit it
    // (the dev profile seeds demo data, which would break assertions on an empty store).
    environment.remove('SPRING_PROFILES_ACTIVE')
}
