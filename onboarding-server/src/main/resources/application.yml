spring:
  application:
    name: partner-onboarding
  profiles:
    group:
      dev: demo   # the dev profile also seeds the demo partners (DemoDataLoader)
  mvc:
    problemdetails:
      enabled: true   # framework errors (bad JSON, bad UUID, 404) also answer with RFC 9457 bodies

onboarding:
  matching:
    candidate-threshold: 0.80   # report as "possible duplicate" from this score
    blocking-threshold: 0.95    # refuse onboarding (409) from this score

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /actuator/health/readiness (Kubernetes probes)
  info:
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 0.1         # 10% of new traces; an incoming sampled trace (traceparent) is always continued
  otlp:
    metrics:
      export:
        enabled: false         # OTLP push only with the otel profile; /actuator/prometheus can always be scraped

springdoc:
  swagger-ui:
    path: /swagger-ui.html
