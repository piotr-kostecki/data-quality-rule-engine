# Export traces and metrics with OpenTelemetry's OTLP/HTTP protocol, to an OpenTelemetry Collector or any OTLP
# backend (Grafana Tempo/Mimir, Jaeger, Elastic, ...). Activate with the "otel" profile, e.g. dev,otel.
# Endpoint: the standard OTEL_EXPORTER_OTLP_ENDPOINT variable, default http://localhost:4318.
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
